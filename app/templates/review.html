<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ brand_name }} — Share your experience and help other travellers discover Uttarakhand.">
    <title>{{ brand_name }} — Review</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <main class="container">

        <!-- ── Brand Header ── -->
        <header class="brand">
            <div class="brand__logo-wrap">
                <img
                    class="brand__logo"
                    src="/static/img/gola-holidays-logo.jpg"
                    alt="Gola Holidays logo"
                    draggable="false"
                >
            </div>
            <p class="brand__tagline">{{ brand_tagline }}</p>
        </header>

        <!-- ── Section Label ── -->
        <div class="divider">Your Google Review</div>

        <!-- ── Review Card ── -->
        <section class="review-card" id="reviewCard">

            <!-- Card header: label + stars -->
            <div class="review-card__header">
                <div class="review-card__label">
                    <!-- Star icon -->
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    AI-Generated Review
                </div>
                <div class="review-card__stars" aria-label="5 out of 5 stars">
                    <span class="star" aria-hidden="true">★</span>
                    <span class="star" aria-hidden="true">★</span>
                    <span class="star" aria-hidden="true">★</span>
                    <span class="star" aria-hidden="true">★</span>
                    <span class="star" aria-hidden="true">★</span>
                </div>
            </div>

            <!-- Review body -->
            <blockquote class="review-card__text" id="reviewText">{{ review_text }}</blockquote>

            <!-- Fake Google-style reviewer row -->
            <div class="review-card__footer">
                <div class="review-card__avatar" aria-hidden="true">GH</div>
                <div class="review-card__reviewer">
                    <strong>Happy Traveller</strong>
                    Posted on Google Maps
                </div>
                <!-- Google "G" badge -->
                <div class="review-card__google-badge" aria-label="Google review">
                    <svg width="14" height="14" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </div>
            </div>
        </section>

        <!-- ── Action Buttons ── -->
        <div class="actions">
            <button class="btn btn--primary" id="copyBtn" onclick="copyAndRedirect()">
                <!-- Copy icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                </svg>
                <span id="copyBtnText">Copy &amp; Post Review</span>
            </button>

            <button class="btn btn--ghost" id="regenBtn" onclick="regenerateReview()">
                <!-- Refresh icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                </svg>
                <span>New Review</span>
            </button>
        </div>

        <!-- ── Footer hint ── -->
        <p class="hint">
            Click <strong>Copy &amp; Post Review</strong> to copy the text, then paste it on Google&nbsp;Maps.<br>
            Use <strong>New Review</strong> to generate a fresh one.
        </p>

    </main>

    <!-- ── Toast ── -->
    <div class="toast" id="toast" role="status" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Copied to clipboard!</span>
    </div>

    <script>
        const GOOGLE_REVIEW_URL = "{{ google_review_url }}";

        /* ─── Copy & redirect ─── */
        async function copyAndRedirect() {
            const reviewText = document.getElementById("reviewText").textContent.trim();
            const btn        = document.getElementById("copyBtn");
            const btnText    = document.getElementById("copyBtnText");

            const writeClipboard = async () => {
                try {
                    await navigator.clipboard.writeText(reviewText);
                } catch {
                    /* Fallback */
                    const ta = Object.assign(document.createElement("textarea"), {
                        value: reviewText,
                        style: "position:fixed;opacity:0;"
                    });
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                }
            };

            await writeClipboard();
            showToast();

            btn.classList.add("btn--success");
            btnText.textContent = "Copied! Opening Google…";

            setTimeout(() => {
                window.open(GOOGLE_REVIEW_URL, "_blank");
                btn.classList.remove("btn--success");
                btnText.textContent = "Copy & Post Review";
            }, 1400);
        }

        /* ─── Regenerate review ─── */
        async function regenerateReview() {
            const card    = document.getElementById("reviewCard");
            const textEl  = document.getElementById("reviewText");
            const regenBtn = document.getElementById("regenBtn");

            regenBtn.disabled = true;
            regenBtn.classList.add("btn--loading");
            card.classList.add("review-card--loading");

            try {
                const res  = await fetch("/api/review");
                const data = await res.json();

                if (data.review) {
                    textEl.style.opacity   = "0";
                    textEl.style.transform = "translateY(6px)";

                    setTimeout(() => {
                        textEl.textContent     = data.review;
                        textEl.style.opacity   = "1";
                        textEl.style.transform = "translateY(0)";
                    }, 280);
                } else {
                    textEl.textContent = "Couldn't generate a review. Please try again.";
                }
            } catch {
                textEl.textContent = "Something went wrong. Please refresh the page.";
            } finally {
                regenBtn.disabled = false;
                regenBtn.classList.remove("btn--loading");
                card.classList.remove("review-card--loading");
            }
        }

        /* ─── Toast helper ─── */
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("toast--visible");
            setTimeout(() => toast.classList.remove("toast--visible"), 2600);
        }
    </script>
</body>
</html>
